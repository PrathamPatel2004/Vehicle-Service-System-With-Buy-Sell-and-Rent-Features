<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up |My Vehicle Service Center</title>

    <!-- CSS & Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        body {
            background-image: url("{% static 'images/bg.jpg' %}");
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Vehicle Service Center</a>
            <button class="navbar-toggler fs-5" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav list-group list-group-flush justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item list-group-item"><a class="nav-link" href="home.html">Home</a></li>
                        <li class="nav-item list-group-item"><a class="nav-link" href="#">About Us</a></li>
                        <li class="nav-item list-group-item"><a class="nav-link" href="#">Login</a></li>
                        <li class="nav-item list-group-item"><a class="nav-link active" href="#">Sign Up</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="row align-items-center justify-content-center mt-5">
        <div class="card col-sm-4 mb-sm-0 mt-5 bg-primary bg-opacity-25 border border-primary rounded shadow">
            <div class="card-body">
                <h4 class="card-title text-center text-white">Verify Email</h4>
                <h6 class="card-subtitle mb-4 text-center  text-body-secondary">Enter the OTP sent to your email</h6>
                <form method="post" class="form text-white" action="{% url 'verify_otp' %}">
                    {% csrf_token %}
                    <div class="mb-2">
                        <label for="otp" class="form-label h-50">Enter OTP</label>
                        <input type="text" class="form-control h-50" name="otp" required>
                    </div>
                    <div class="mb-2 mt-3">
                        <button type="submit" class="btn btn-primary align-items-center w-100">Verify OTP</button>
                    </div>
                    <p>Didn't receive OTP? <button id="resendOtp" class="btn btn-link p-0 m-0">Resend</button></p>
                    <p id="resendMessage" class="text-success" style="display: none;"></p>
                </form>
                <div id="loadingMessage" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status" id="loadingMessage">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Django Messages -->
    {% if err_message %}
        <script>alert('{{ err_message }}');</script>
    {% endif %}
    {% if message %}
        <script>alert('{{ message }}');</script>
    {% endif %}

    <!-- JavaScript -->
    <script>
        document.getElementById('resendOtp').addEventListener('click', function() {
            this.disabled = true;
            fetch('{% url "resend_otp" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('resendMessage').textContent = data.message;
                document.getElementById('resendMessage').style.display = 'block';
                setTimeout(() => {
                    this.disabled = false;
                }, 30000); // Enable resend after 30 seconds
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('resendMessage').textContent = 'Failed to resend OTP. Please try again.';
                document.getElementById('resendMessage').style.display = 'block';
                this.disabled = false;
            });
        });
    </script>

     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
